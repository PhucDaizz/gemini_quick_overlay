name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $v = python -c "from gemini_overlay import __version__; print(__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} khong khop __version__ ($v)"
            exit 1
          }

      - name: Run tests
        run: python -m unittest tests.test_config tests.test_chrome_launcher tests.test_update_checker

      - name: Build EXE
        run: python -m PyInstaller --noconfirm GeminiQuickOverlay.spec

      - name: Package
        shell: pwsh
        run: |
          $dir = "GeminiQuickOverlay-${{ github.ref_name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item dist/GeminiQuickOverlay.exe, START_TOOL.vbs, TAT_TOOL.bat, config.json $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiQuickOverlay-${{ github.ref_name }}.zip
          generate_release_notes: true
