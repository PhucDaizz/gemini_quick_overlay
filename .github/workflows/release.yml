name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $project = "src/GeminiQuickOverlay.App/GeminiQuickOverlay.App.csproj"
          $csproj = ([xml](Get-Content $project)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $constants = Select-String -Path src/GeminiQuickOverlay.Core/AppConstants.cs -Pattern 'AppVersion = "([^"]+)"'
          $code = $constants.Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$csproj" -or $tag -ne "v$code") {
            Write-Error "Tag $tag does not match csproj Version ($csproj) / AppConstants.AppVersion ($code)"
            exit 1
          }

      - name: Publish
        run: dotnet publish src/GeminiQuickOverlay.App/GeminiQuickOverlay.App.csproj -c Release -o publish --nologo

      - name: Package
        shell: pwsh
        run: |
          $dir = "GeminiQuickOverlay-${{ github.ref_name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item publish/GeminiQuickOverlay.exe $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiQuickOverlay-${{ github.ref_name }}.zip
          generate_release_notes: true
